<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EstateSuite ZA — domain tests</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin: 0; padding: 24px; background: #15271D; color: #F1EFE9;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .summary { margin: 12px 0 20px; padding: 8px 12px; border: 1px solid #2C4636; }
    .pass { color: #7FB77E; }
    .fail { color: #E0876A; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 3px 0; border-bottom: 1px solid #1D3327; }
    .msg { color: #E0876A; padding-left: 20px; }
    .ok::before { content: '✓ '; color: #7FB77E; }
    .no::before { content: '✕ '; color: #E0876A; }
  </style>
</head>
<body>
  <h1>EstateSuite&nbsp;ZA — domain tests</h1>
  <div class="summary" id="summary">running…</div>
  <ul id="list"></ul>

  <script type="module">
    import { run } from './domain.test.js';
    const results = run();
    const passed = results.filter((r) => r.ok).length;
    const failed = results.length - passed;
    const summary = document.getElementById('summary');
    summary.innerHTML =
      `<strong class="${failed ? 'fail' : 'pass'}">` +
      `${passed}/${results.length} passed` +
      (failed ? ` — ${failed} FAILED` : '') + '</strong>';
    const list = document.getElementById('list');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'no';
      li.textContent = r.name;
      list.appendChild(li);
      if (!r.ok) {
        const m = document.createElement('div');
        m.className = 'msg';
        m.textContent = r.message;
        list.appendChild(m);
      }
    }
    // Machine-readable hook for headless checks.
    window.__TEST_RESULT__ = { passed, failed, total: results.length };
    console.log(`[tests] ${passed}/${results.length} passed, ${failed} failed`);
  </script>
</body>
</html>
